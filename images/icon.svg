<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2638" />
      <stop offset="50%" stop-color="#111726" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>

    <!-- Squircle Border Subtle Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38455E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <!-- Browser Outline Gradient -->
    <linearGradient id="browserBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>

    <!-- Reload Arrow Gradient -->
    <linearGradient id="reloadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="80%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Arrow Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Browser Window Frame -->
  <g transform="translate(68, 68)">
    <!-- Browser Window Card -->
    <rect x="0" y="0" width="376" height="376" rx="36" fill="#0D1321" stroke="url(#browserBorder)" stroke-width="4.5" />
    
    <!-- Browser Header Divider -->
    <line x1="0" y1="52" x2="376" y2="52" stroke="url(#browserBorder)" stroke-width="3" />

    <!-- Window Controls (Traffic Lights) -->
    <circle cx="28" cy="26" r="6.5" fill="#EF4444" />
    <circle cx="48" cy="26" r="6.5" fill="#F59E0B" />
    <circle cx="68" cy="26" r="6.5" fill="#10B981" />

    <!-- Minimal Address Bar Pill -->
    <rect x="96" y="16" width="184" height="20" rx="10" fill="#1E293B" opacity="0.6" />

    <!-- Center Reload Icon with Glow -->
    <g filter="url(#cyanGlow)">
      <!-- Smooth circular arc path -->
      <path d="M 188,116
               A 98,98 0 1,1 118,154" 
            fill="none" 
            stroke="url(#reloadGrad)" 
            stroke-width="26" 
            stroke-linecap="round" />
      
      <!-- Arrowhead -->
      <path d="M 194,84 
               L 204,136 
               L 152,126 
               Z" 
            fill="url(#reloadGrad)" 
            stroke="url(#reloadGrad)" 
            stroke-width="4" 
            stroke-linejoin="round" />
    </g>
  </g>
</svg>